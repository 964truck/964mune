<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>964 Street Bites | المنيو الإلكتروني</title>
<style>
:root {
  --bg-color: #121212;
  --card-bg: #1e1e1e;
  --accent-color: #ff6600;
  --text-color: #ffffff;
  --text-muted: #b0b0b0;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 0;
}
.header {
  text-align: center;
  padding: 20px;
  background: var(--card-bg);
  border-bottom: 2px solid var(--accent-color);
}
.header h1 {
  margin: 0;
  color: var(--accent-color);
  font-size: 24px;
}
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 15px;
}
.item-card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #333;
}
.item-info h3 {
  margin: 0 0 5px 0;
  font-size: 18px;
}
.item-info p {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
}
.item-price {
  color: var(--accent-color);
  font-weight: bold;
  margin-top: 5px;
}
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-qty {
  background: #333;
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card-bg);
  padding: 15px;
  text-align: center;
  border-top: 1px solid #333;
}
.btn-order {
  background: #25d366;
  color: white;
  border: none;
  padding: 12px 30px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  width: 100%;
  max-width: 400px;
}
</style>
</head>
<body>
<div class="header">
  <h1>964 Street Bites</h1>
  <p>حي المدراء، البصرة 🍔🌮</p>
</div>
<div class="container">
  <div class="item-card">
    <div class="item-info">
      <h3>تاكو لحم / دجاج</h3>
      <p>تاكو مقرمش مع الصوص الخاص</p>
      <div class="item-price">5,000 د.ع</div>
    </div>
    <div class="controls">
      <button class="btn-qty" onclick="changeQty('taco', -1)">-</button>
      <span id="qty-taco">0</span>
      <button class="btn-qty" onclick="changeQty('taco', 1)">+</button>
    </div>
  </div>
  <div class="item-card">
    <div class="item-info">
      <h3>بوريتو مقرمش</h3>
      <p>دجاج أو لحم مع الجبن والصلصة</p>
      <div class="item-price">6,000 د.ع</div>
    </div>
    <div class="controls">
      <button class="btn-qty" onclick="changeQty('burrito', -1)">-</button>
      <span id="qty-burrito">0</span>
      <button class="btn-qty" onclick="changeQty('burrito', 1)">+</button>
    </div>
  </div>
  <div class="item-card">
    <div class="item-info">
      <h3>بطاطا بالجبن</h3>
      <p>بطاطا مقرمشة مغطاة بالجبن السائحة</p>
      <div class="item-price">4,000 د.ع</div>
    </div>
    <div class="controls">
      <button class="btn-qty" onclick="changeQty('fries', -1)">-</button>
      <span id="qty-fries">0</span>
      <button class="btn-qty" onclick="changeQty('fries', 1)">+</button>
    </div>
  </div>
</div>
<div style="height: 80px;"></div>
<div class="footer">
  <button class="btn-order" onclick="sendOrder()">إرسال الطلب عبر الواتساب 📲</button>
</div>
<script>
let cart = { taco: 0, burrito: 0, fries: 0 };
function changeQty(item, delta) {
  cart[item] = Math.max(0, cart[item] + delta);
  document.getElementById('qty-' + item).innerText = cart[item];
}
function sendOrder() {
  let message = "مرحباً، أريد طلب الآتي من 964 Street Bites:%0A";
  let total = 0;
  if(cart.taco > 0) { message += `- تاكو: ${cart.taco} (${cart.taco * 5000} د.ع)%0A`; total += cart.taco * 5000; }
  if(cart.burrito > 0) { message += `- بوريتو: ${cart.burrito} (${cart.burrito * 6000} د.ع)%0A`; total += cart.burrito * 6000; }
  if(cart.fries > 0) { message += `- بطاطا بالجبن: ${cart.fries} (${cart.fries * 4000} د.ع)%0A`; total += cart.fries * 4000; }
  if(total === 0) { alert("الرجاء اختيار وجبة واحدة على الأقل!"); return; }
  message += `%0Aالمجموع الكلي: ${total} د.ع`;
  let phone = "9647722202416";
  window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
}
</script>
</body>
</html>
